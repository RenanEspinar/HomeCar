
name: Build HomeCar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 36 and Build Tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android Auto bundle
        run: |
          chmod +x ./gradlew
          ./gradlew :fermata:bundleAutoDebug --no-daemon --stacktrace

      - name: Generate universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          AAB="$(find fermata/build/outputs/bundle -type f -name '*.aab' -path '*autoDebug*' -print -quit)"

          if [[ -z "$AAB" ]]; then
            echo "::error::Android Auto AAB not found in autoDebug output"
            exit 1
          fi

          curl -fL --retry 5 \
            -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar

          java -jar /tmp/bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=/tmp/homecar.apks \
            --mode=universal

          unzip -p /tmp/homecar.apks universal.apk > dist/HomeCar-Auto.apk
          test -s dist/HomeCar-Auto.apk

      - name: Upload HomeCar APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCar-Auto-APK
          path: dist/HomeCar-Auto.apk
          if-no-files-found: error
